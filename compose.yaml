services:
  postgres:
    image: postgres:16.14
    container_name: nutrianimales_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=nutrianimales
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - MONITOR_PASSWORD=${MONITOR_PASSWORD:?Set MONITOR_PASSWORD in .env}
      - AGENTE_IA_PASSWORD=${AGENTE_IA_PASSWORD:?Set AGENTE_IA_PASSWORD in .env}
      - GERENTE_PASSWORD=${GERENTE_PASSWORD:?Set GERENTE_PASSWORD in .env}
      - TI_PASSWORD=${TI_PASSWORD:?Set TI_PASSWORD in .env}
      - AUDITOR_PASSWORD=${AUDITOR_PASSWORD:?Set AUDITOR_PASSWORD in .env}
      - BACKUP_PASSWORD=${BACKUP_PASSWORD:?Set BACKUP_PASSWORD in .env}
      - N8N_DB_PASSWORD=${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in .env}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=trust
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/sql:/docker-entrypoint-initdb.d:ro
      - ./infra/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./infra/postgres-tls:/run/pg-tls:ro
      - ./infra/postgres-logs:/var/log/postgresql
    networks:
      - nutrianimales-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nutrianimales"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:2.30.8
    container_name: nutrianimales_n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=nutrianimales
      - DB_POSTGRESDB_USER=n8n_app
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in .env}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      - DB_POSTGRESDB_SSL_ENABLED=true
      - DB_POSTGRESDB_SSL_CA_FILE=/run/pg-ca/server.crt
      # Los nodos Postgres de los flujos verifican el certificado del laboratorio.
      - NODE_EXTRA_CA_CERTS=/run/pg-ca/server.crt
      - DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED=true
      - DB_POSTGRESDB_SCHEMA=n8n
      - N8N_LOG_LEVEL=debug
    volumes:
      - n8n_data:/home/node/.n8n
      - ./infra/postgres-tls/server.crt:/run/pg-ca/server.crt:ro
    networks:
      - nutrianimales-net
    user: "1000:1000"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:latest
    container_name: nutrianimales_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/auditoria.html:/srv/auditoria.html:ro
      - ./infra/certs:/certs:ro
    networks:
      - nutrianimales-net
    user: "1000:1000"
    depends_on:
      - n8n

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nutrianimales_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-ti@nutrianimales.test}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    networks:
      - nutrianimales-net

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: nutrianimales_filebeat
    restart: unless-stopped
    user: "1000:1000"
    group_add:
      - "4"
    volumes:
      - ./infra/logging/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/log/ufw.log:/var/log/ufw.log:ro
    networks:
      - nutrianimales-net
    command: filebeat -e -strict.perms=false -E path.data=/tmp/filebeat

networks:
  nutrianimales-net:
    driver: bridge

volumes:
  pgdata:
  n8n_data:
