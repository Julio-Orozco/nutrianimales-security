# Sin directiva user: Docker ya ejecuta Nginx con un UID no privilegiado.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  server_tokens off;
  client_max_body_size 1m;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    return 308 https://localhost:8443$request_uri;
  }
  server {
    listen 8443 ssl;
    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # HSTS solo tiene sentido después de confiar en la CA local.
    add_header Strict-Transport-Security 'max-age=86400' always;
    # n8n necesita scripts inline. El panel de auditoría usa un JS local.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://localhost:8443; frame-ancestors 'none'; base-uri 'self'" always;
    location = /auditoria.html { root /srv; }
    location /pgadmin/ {
      set $pgadmin http://pgadmin:80;
      proxy_pass $pgadmin;
      proxy_set_header X-Script-Name /pgadmin;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Host $host;
    }
    location / {
      set $n8n http://n8n:5678;
      proxy_pass $n8n;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
