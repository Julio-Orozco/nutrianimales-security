# Solo el administrador interno usa el socket local sin contraseña.
local all postgres trust
local all all scram-sha-256
# La red 99 es un origen de pruebas privado, fuera del CIDR permitido por H4.
hostssl all all 172.30.40.0/24 scram-sha-256
hostssl all all 172.30.99.0/24 scram-sha-256
hostnossl all all 0.0.0.0/0 reject
hostssl all all 0.0.0.0/0 reject
host all all ::0/0 reject
